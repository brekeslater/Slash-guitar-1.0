
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b18">
<title>Slash Guitar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 10px;
  background: radial-gradient(circle at top, #29204c, #090b18 65%);
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 15px 5px;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 8vw, 48px);
  font-weight: 900;
  letter-spacing: 4px;
  color: #a78bfa;
  text-shadow: 0 0 22px #8b5cf6;
}

.subtitle {
  color: #aab3d3;
  font-size: 13px;
  letter-spacing: 3px;
}

.panel {
  max-width: 540px;
  margin: 15px auto;
  padding: 18px;
  background: #14172bed;
  border: 1px solid #39365e;
  border-radius: 18px;
  box-shadow: 0 12px 35px #0006;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #b8b8d8;
  text-align: left;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

select {
  width: 100%;
  padding: 12px;
  color: white;
  background: #090c1b;
  border: 1px solid #45436b;
  border-radius: 10px;
  font-size: 15px;
}

button {
  border: 0;
  border-radius: 11px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#start {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  color: #090b18;
  background: linear-gradient(100deg, #a78bfa, #55e7ff);
  font-size: 16px;
}

#game {
  display: none;
  position: relative;
  width: 100%;
  max-width: 540px;
  height: 55vh;
  min-height: 350px;
  max-height: 570px;
  margin: 18px auto;
  overflow: hidden;
  background: #0c1022;
  border: 2px solid #504777;
  border-radius: 15px;
}

.lanes {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
}

.lane {
  position: relative;
  border-right: 1px solid #383754;
}

.lane:last-child {
  border-right: none;
}

.hitline {
  position: absolute;
  top: 81%;
  left: 0;
  width: 100%;
  height: 5px;
  background: white;
  box-shadow: 0 0 15px white;
}

.hitlabels {
  position: absolute;
  top: 85%;
  left: 0;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  color: #bcb8e8;
  font-weight: bold;
}

#stats {
  display: flex;
  justify-content: space-around;
  gap: 8px;
  margin: 15px auto;
}

.stat {
  padding: 10px;
  flex: 1;
  background: #171a30;
  border: 1px solid #343755;
  border-radius: 10px;
}

.stat small {
  display: block;
  color: #aab3d3;
  font-size: 10px;
  text-transform: uppercase;
}

.stat strong {
  font-size: 20px;
}

#controls {
  display: none;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  width: 100%;
  max-width: 540px;
  margin: 10px auto;
}

.key {
  min-height: 60px;
  color: #10101a;
  border: 2px solid #ffffff80;
  font-size: 20px;
}

.key:active {
  filter: brightness(1.4);
  transform: scale(.96);
}

#message {
  min-height: 25px;
  color: #bcb8e8;
  font-weight: bold;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.actions button {
  padding: 11px 15px;
  color: white;
  background: #282747;
  border: 1px solid #4b4775;
}

footer {
  max-width: 540px;
  margin: 25px auto;
  color: #858ba9;
  font-size: 12px;
  line-height: 1.6;
}
</style>
</head>

<body>

<header>
  <h1>SLASH GUITAR</h1>
  <p class="subtitle">FEEL THE BEAT</p>
</header>

<section id="menu" class="panel">
  <h2>Prepare-se para o palco</h2>
  <p>Escolhe a dificuldade e mostra tua habilidade!</p>

  <label for="song">Faixa musical</label>
  <select id="song">
    <option value="neon">Neon Riot</option>
    <option value="storm">Electric Storm</option>
    <option value="drive">Midnight Drive</option>
  </select>

  <label for="difficulty">Dificuldade</label>
  <select id="difficulty">
    <option value="easy">Fácil</option>
    <option value="medium" selected>Médio</option>
    <option value="hard">Difícil</option>
    <option value="expert">Expert</option>
  </select>

  <button id="start">▶ COMEÇAR A JOGAR</button>
</section>

<div id="stats" style="display:none">
  <div class="stat">
    <small>Pontos</small>
    <strong id="score">0</strong>
  </div>
  <div class="stat">
    <small>Combo</small>
    <strong id="combo">0</strong>
  </div>
  <div class="stat">
    <small>Erros</small>
    <strong id="miss">0</strong>
  </div>
</div>

<div id="game">
  <div class="lanes">
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>
  </div>

  <div class="hitline"></div>

  <div class="hitlabels">
    <span>A</span>
    <span>S</span>
    <span>D</span>
    <span>F</span>
    <span>G</span>
  </div>
</div>

<div id="controls">
  <button class="key" data-k="0" style="background:#ff5577">A</button>
  <button class="key" data-k="1" style="background:#ffc857">S</button>
  <button class="key" data-k="2" style="background:#54e6a5">D</button>
  <button class="key" data-k="3" style="background:#55baff">F</button>
  <button class="key" data-k="4" style="background:#c69bff">G</button>
</div>

<div id="message"></div>

<div class="actions">
  <button id="pause" style="display:none">Ⅱ Pausar</button>
  <button id="restart" style="display:none">↻ Reiniciar</button>
  <button id="back" style="display:none">← Menu</button>
</div>

<footer>
  Slash Guitar — uma experiência de ritmo para celular e computador.
  Acerte as notas, aumente seu combo e conquiste o palco!
</footer>

<!-- O JavaScript do jogo será acrescentado no próximo bloco. -->

</body>
</html>
